[project]
name = "meetschedule-sdk"
version = "1.2"
description = "Python SDK for the Meet Schedule Open API — 面向第三方的课程表开放接口"
readme = "README.md"
license = 'MIT'
authors = [{ name = "Bail", email = "2915289604@qq.com" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "pydantic>=2.13.4"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
dev = ["ipykernel>=7.3.0"]
